[project]
name = "reading-hub"
version = "0.10.9"
description = "A local, versioned reader for articles and HTML books."
requires-python = ">=3.14"
dependencies = [
    "Django>=5.2.8,<5.3",
    "beautifulsoup4>=4.14.2,<5",
    "nh3>=0.3.2,<0.4",
    "Pillow>=12,<13",
    "WeasyPrint>=68,<69",
    "tinycss2>=1.5,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.14.4,<1", "pypdf>=6,<7"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "library*", "profiles*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
