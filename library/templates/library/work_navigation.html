{% if can_edit_work and version %}
<nav class="work-navigation" aria-label="Work destinations">
  {% with workspace_version=reader_target|default:version %}
  <a href="{% url 'document-editor' workspace_version.pk %}?tab=read"{% if active_work_tab == "read" %} aria-current="page"{% endif %}>Read</a>
  <a href="{% url 'document-editor' workspace_version.pk %}?tab=edit"{% if active_work_tab == "edit" %} aria-current="page"{% endif %}>Edit</a>
  <a href="{% url 'document-editor' workspace_version.pk %}?tab=versions"{% if active_work_tab == "versions" %} aria-current="page"{% endif %}>Versions</a>
  <a href="{% url 'document-editor' workspace_version.pk %}?tab=sources"{% if active_work_tab == "sources" %} aria-current="page"{% endif %}>Sources</a>
  {% endwith %}
</nav>
{% endif %}
