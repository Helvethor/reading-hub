{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'library/app.css' %}?v={{ app_version }}-workspace-v60">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{% static site.theme_css %}?v={{ app_version }}-square-ui-sv1" data-site-theme>
  {% if site.key == "marxist" %}<link rel="stylesheet" href="{% static 'marxist/square-ui.css' %}?v={{ app_version }}-square-ui-sv2" media="screen">{% endif %}
  <script type="module" src="{% static 'library/themes.js' %}?v={{ app_version }}"></script>
</head>
<body>
  <main id="main">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
