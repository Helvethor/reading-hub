{% extends 'library/base.html' %}
{% block title %}Change password | {{ site.name }}{% endblock %}
{% block content %}
<div class="page-container">
  <h1>Change password</h1>
  <form method="post" class="account-form">
    {% csrf_token %}
    <fieldset><legend>Password</legend>{{ form.as_p }}
    <div class="form-actions"><button type="submit">Change password</button></div></fieldset>
  </form>
</div>
{% endblock %}
